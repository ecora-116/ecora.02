<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoRA | Asistente RA</title>
<meta name="description" content="Asistente de EcoRA: la IA reconoce el residuo y una flecha señala el bote real correcto.">
<style>
:root {
  --green: #247653;
  --dark: #173d30;
  --lime: #8bc34a;
  --red: #e0533d;
  --text: #25352d;
  --muted: #6b7a71;
  --sheet-h: 240px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0d1f18; color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.stage { position: fixed; inset: 0; overflow: hidden; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.no-cam {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center;
  background: linear-gradient(180deg, #24372f 0%, #33473d 60%, #4a5e52 100%); color: #d6e2d8;
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0, transparent 18%, transparent 60%, rgba(0,0,0,.35) 100%);
}

/* Barra superior */
.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
}
.pill {
  color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; border: 0;
  background: rgba(0, 0, 0, .38); padding: 9px 13px; border-radius: 999px; backdrop-filter: blur(6px);
}
.spacer { flex: 1; }
.badge {
  font-size: 11px; font-weight: 800; letter-spacing: 1px; white-space: nowrap;
  background: rgba(139, 195, 74, .92); color: var(--dark); padding: 6px 10px; border-radius: 999px;
}

/* Paso 1: recuadro para reconocer el residuo */
.reticle {
  position: absolute; left: 50%; top: calc((100% - var(--sheet-h)) * .48);
  width: min(62vw, 270px); aspect-ratio: 1; transform: translate(-50%, -50%);
  z-index: 3; transition: transform .3s, opacity .3s;
}
.reticle i {
  position: absolute; width: 22%; height: 22%;
  border: 4px solid rgba(255, 255, 255, .9); transition: border-color .3s;
}
.reticle i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.reticle i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.reticle i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.reticle i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
.reticle .scanline {
  position: absolute; left: 8%; right: 8%; height: 3px; top: 8%; opacity: 0;
  background: var(--lime); box-shadow: 0 0 14px 2px var(--lime); border-radius: 3px;
}
.reticle.searching .scanline { opacity: .9; animation: scan 1.6s ease-in-out infinite; }
@keyframes scan { 0%, 100% { top: 8%; } 50% { top: 90%; } }
.live {
  position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%);
  white-space: nowrap; font-size: 13px; font-weight: 700;
  background: rgba(0, 0, 0, .5); padding: 6px 12px; border-radius: 999px;
}

/* Paso 2: marca sobre el bote real (se coloca donde está su QR) */
.marker {
  position: absolute; z-index: 4; pointer-events: none;
  border: 5px solid var(--lime); border-radius: 18px;
  box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 0 30px 6px rgba(139, 195, 74, .55);
  transition: left .12s linear, top .12s linear, width .12s linear, height .12s linear;
}
.marker.bad { border-color: var(--red); box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 0 30px 6px rgba(224, 83, 61, .55); }
.marker .tag {
  position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%);
  white-space: nowrap; font-size: 15px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
  background: var(--lime); color: var(--dark); box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
}
.marker.bad .tag { background: var(--red); color: #fff; }
.marker .arrow {
  position: absolute; left: 50%; bottom: calc(100% + 12px);
  width: 64px; height: 94px; transform: translateX(-50%);
  animation: bob .9s ease-in-out infinite; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .55));
}
.marker.bad .arrow { display: none; }
.marker .cross {
  position: absolute; inset: 0; display: none; place-items: center;
  font-size: 64px; font-weight: 900; color: var(--red); text-shadow: 0 4px 16px rgba(0,0,0,.6);
}
.marker.bad .cross { display: grid; }
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -16px); } }

.goal {
  position: absolute; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%);
  z-index: 5; white-space: nowrap; font-size: 15px; font-weight: 800;
  background: #fff; color: var(--dark); padding: 9px 15px; border-radius: 999px;
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .6);
}

/* Panel inferior */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  background: #fff; color: var(--text); border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -12px 30px rgba(0, 0, 0, .3); max-width: 560px; margin: 0 auto;
}
.sheet h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.3px; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.sheet .tip { margin-top: 8px; color: var(--green); font-weight: 600; }
.sheet .warn { margin-top: 8px; color: var(--red); font-weight: 700; }
.sheet .ok { margin-top: 8px; color: var(--green); font-weight: 800; }
.sheet label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; color: var(--text); }
.field {
  width: 100%; padding: 12px; border: 1px solid #e3e9df; border-radius: 12px;
  background: #fbfcfa; color: var(--text); font-size: 14px;
}
.btn {
  display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 14px;
  background: var(--green); color: #fff; font-weight: 800; font-size: 16px; text-align: center; text-decoration: none;
}
.btn:disabled { background: #b9c6bd; cursor: not-allowed; }
.btn.secondary { background: #eef3ea; color: var(--dark); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.bar { height: 8px; border-radius: 999px; background: #e8eee5; overflow: hidden; margin-top: 12px; }
.bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--lime)); transition: width .3s; }

.pop {
  position: absolute; left: 50%; top: 36%; z-index: 7; pointer-events: none;
  font-size: 46px; font-weight: 900; color: var(--lime);
  text-shadow: 0 4px 22px rgba(0, 0, 0, .7); animation: pop 1.5s ease-out forwards;
}
@keyframes pop {
  0%   { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
  20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <div class="no-cam" id="noCam" hidden><p id="noCamText">No pudimos abrir la cámara.</p></div>
  <div class="shade"></div>
  <canvas id="frame" width="224" height="224" hidden></canvas>
  <canvas id="qrCanvas" hidden></canvas>

  <header class="top">
    <a class="pill" href="index.html">← EcoRA</a>
    <span class="spacer"></span>
    <span class="badge" id="badge">IA EN VIVO</span>
    <button class="pill" type="button" id="settingsBtn" aria-label="Modelo de IA">⚙</button>
  </header>

  <div class="reticle" id="reticle" aria-hidden="true">
    <i></i><i></i><i></i><i></i>
    <div class="scanline"></div>
    <div class="live" id="live" hidden></div>
  </div>

  <div class="goal" id="goal" hidden></div>

  <div class="marker" id="marker" hidden aria-hidden="true">
    <svg class="arrow" viewBox="0 0 54 80">
      <defs>
        <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c5e88f"/>
          <stop offset="1" stop-color="#5aa02c"/>
        </linearGradient>
      </defs>
      <path d="M17 2h20v42h15L27 78 2 44h15z" fill="url(#arrowGrad)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <div class="cross">✕</div>
    <div class="tag" id="markerTag"></div>
  </div>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<script>
"use strict";

/* ==========================================================
   EcoRA · Asistente RA
   Paso 1: la IA reconoce el residuo con la cámara.
     - Modelo EcoRA (Teachable Machine), si se configuró su enlace.
     - Si no, MobileNet (IA general): reconoce botellas y cartón.
   Paso 2: la cámara busca el QR pegado en el bote REAL y dibuja
     una flecha encima de él (verde si es el correcto, roja si no).
   ========================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz28oW8ic4iomKXCYPQ2XBXL5c_rwYW8ZHi0iL6apFqsItBJlhXuBQ7_2RfuPZlo5Qt/exec",
  STORAGE_KEY: "ecora.web.v3",      // misma sesión que la página principal
  MODEL_KEY: "ecora.tm.model",      // enlace del modelo de Teachable Machine
  TF_URL: "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js",
  MOBILENET_URL: "https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js",
  JSQR_URL: "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
  AI_INTERVAL_MS: 300,   // cada cuánto analiza el residuo
  QR_INTERVAL_MS: 150,   // cada cuánto busca el bote
  FRAMES_NEEDED: 3,      // cuadros seguidos iguales para confirmar el residuo
  MIN_GENERAL: 0.30,     // seguridad mínima con la IA general
  MIN_TM: 0.80,          // seguridad mínima con el modelo EcoRA
  LOST_MS: 700,          // si no ve el bote este tiempo, quita la flecha
};

const WASTE = {
  pet:      { name: "Botella de plástico", icon: "🧴", bin: "plastico", tip: "Vacíala y aplástala antes de tirarla." },
  aluminio: { name: "Lata de aluminio",    icon: "🥫", bin: "metal",    tip: "Enjuágala y aplástala para que ocupe menos." },
  carton:   { name: "Cartón",              icon: "📦", bin: "papel",    tip: "Dóblalo y revisa que esté seco y limpio." },
};
const BINS = {
  plastico: { name: "Plásticos" },
  metal:    { name: "Metales" },
  papel:    { name: "Papel y cartón" },
};

/* Clases de la IA general (ImageNet) que cuentan para cada material */
const GENERAL_MAP = [
  { material: "pet",    words: ["water bottle", "pop bottle", "soda bottle", "water jug", "beer bottle", "wine bottle", "pill bottle", "plastic bag"] },
  { material: "carton", words: ["carton", "packet", "envelope", "crate", "paper towel", "toilet tissue", "toilet paper"] },
];

const $ = (id) => document.getElementById(id);

let phase = "loading";      // loading | searching | locating | paused | done | error
let ai = null;              // { kind: "general" | "ecora", net, labels? }
let qr = null;              // { kind: "native", detector } | { kind: "jsqr" }
let cameraReady = false;
let aiTimer = null, qrTimer = null;
let analyzing = false, scanningQr = false;
let streak = { material: null, count: 0 };
let current = null;         // residuo reconocido
let found = null;           // { id, bin } bote correcto ya visto
let lastSeen = 0;
let busy = false;

/* ---------- Utilidades ---------- */
function loadScript(url) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${url}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error("No se pudo cargar " + url));
    document.head.appendChild(s);
  });
}
function fitSheet() { $("stage").style.setProperty("--sheet-h", $("sheet").offsetHeight + "px"); }
function storageGet(key) { try { return localStorage.getItem(key) || ""; } catch { return ""; } }
function storageSet(key, value) {
  try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch { /* sin almacenamiento */ }
}

function normalizeModelUrl(raw) {
  let url = String(raw || "").trim();
  if (!url) return "";
  if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[A-Za-z0-9_-]+\/?/.test(url)) return null;
  url = url.split(/[?#]/)[0].replace(/(model\.json|metadata\.json)$/, "");
  return url.endsWith("/") ? url : url + "/";
}

/* El enlace del modelo puede venir en la dirección: ra.html?modelo=https://teachablemachine... */
function getModelUrl() {
  const param = new URLSearchParams(location.search).get("modelo");
  if (param === "general") storageSet(CONFIG.MODEL_KEY, "");
  else if (param) {
    const url = normalizeModelUrl(param);
    if (url) storageSet(CONFIG.MODEL_KEY, url);
  }
  return storageGet(CONFIG.MODEL_KEY);
}

/* Lee el QR de un bote: "ECORA-PLASTICO", o un enlace con ?bote=ECORA-PLASTICO */
function parseBin(raw) {
  let id = String(raw || "").trim();
  try {
    const url = new URL(id);
    id = url.searchParams.get("bote") || url.pathname.split("/").filter(Boolean).pop() || "";
  } catch { /* no es enlace */ }
  if (!/^[A-Za-z0-9_-]{3,40}$/.test(id)) return null;
  const up = id.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (!up.startsWith("ECORA")) return null;
  let bin = null;
  if (/PLAST|PET/.test(up)) bin = "plastico";
  else if (/METAL|LATA|ALUMIN/.test(up)) bin = "metal";
  else if (/PAPEL|CARTON/.test(up)) bin = "papel";
  return { id, bin };
}

/* ---------- Cámara ---------- */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showNoCam("Este navegador no permite usar la cámara. Abre la página en Chrome.");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    const video = $("video");
    video.srcObject = stream;
    try { await video.play(); } catch { /* algunos navegadores lo inician solos */ }
    cameraReady = true;
  } catch {
    showNoCam("No pudimos abrir la cámara. Toca el candado junto a la dirección y permite la cámara.");
  }
}
function showNoCam(text) {
  $("noCamText").textContent = text;
  $("noCam").hidden = false;
}

/* ---------- IA: reconocer el residuo ---------- */
async function loadAI() {
  const bar = (pct, text) => {
    const b = $("loadBar"); if (b) b.style.width = pct + "%";
    const t = $("loadText"); if (t && text) t.textContent = text;
  };

  bar(10, "Cargando el motor de IA…");
  await loadScript(CONFIG.TF_URL);
  await window.tf.ready();

  const modelUrl = getModelUrl();
  if (modelUrl) {
    try {
      bar(45, "Cargando el modelo EcoRA…");
      const net = await window.tf.loadLayersModel(modelUrl + "model.json");
      const meta = await fetch(modelUrl + "metadata.json").then((r) => r.json());
      ai = { kind: "ecora", net, labels: meta.labels || [] };
    } catch {
      ai = null;
      $("badge").textContent = "MODELO ECORA NO CARGÓ";
    }
  }
  if (!ai) {
    bar(45, "Cargando la IA general…");
    await loadScript(CONFIG.MOBILENET_URL);
    const net = await window.mobilenet.load({ version: 2, alpha: 1.0 });
    ai = { kind: "general", net };
  }

  bar(80, "Preparando el lector de botes…");
  await loadQrReader();

  bar(90, "Calentando la IA…");
  await analyzeFrame(true);
  bar(100);
  $("badge").textContent = ai.kind === "ecora" ? "IA ECORA EN VIVO" : "IA GENERAL EN VIVO";
}

function grabFrame() {
  const video = $("video");
  const canvas = $("frame");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return null;
  const size = Math.min(w, h) * 0.75;   // el centro de la imagen (el recuadro)
  ctx.drawImage(video, (w - size) / 2, (h - size) / 2, size, size, 0, 0, 224, 224);
  return canvas;
}

/** Devuelve { material, prob } o null si no ve ningún residuo. */
async function analyzeFrame(warmup) {
  const canvas = cameraReady ? grabFrame() : null;
  const input = canvas || $("frame");

  if (ai.kind === "ecora") {
    const tf = window.tf;
    const out = tf.tidy(() => {
      const img = tf.browser.fromPixels(input).toFloat();
      return ai.net.predict(img.sub(127.5).div(127.5).expandDims(0));
    });
    const probs = await out.data();
    out.dispose();
    if (warmup || !canvas) return null;
    let best = 0;
    for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
    const material = materialFromLabel(ai.labels[best]);
    return material && probs[best] >= CONFIG.MIN_TM ? { material, prob: probs[best] } : null;
  }

  const preds = await ai.net.classify(input, 5);
  if (warmup || !canvas) return null;
  const totals = {};
  preds.forEach((p) => {
    const name = p.className.toLowerCase();
    const group = GENERAL_MAP.find((g) => g.words.some((w) => name.includes(w)));
    if (group) totals[group.material] = (totals[group.material] || 0) + p.probability;
  });
  const best = Object.keys(totals).sort((a, b) => totals[b] - totals[a])[0];
  return best && totals[best] >= CONFIG.MIN_GENERAL ? { material: best, prob: Math.min(totals[best], 0.99) } : null;
}

/* Nombres de clase del modelo EcoRA: "PET", "Lata", "Carton", "Nada"… */
function materialFromLabel(label) {
  const l = String(label || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (/pet|plast|botella/.test(l)) return "pet";
  if (/lata|alumin|metal/.test(l)) return "aluminio";
  if (/carton|papel/.test(l)) return "carton";
  return null;
}

function startAiLoop() {
  clearInterval(aiTimer);
  aiTimer = setInterval(async () => {
    if (phase !== "searching" || analyzing || !cameraReady) return;
    analyzing = true;
    try {
      const res = await analyzeFrame(false);
      const live = $("live");
      live.hidden = false;
      live.textContent = res
        ? "Veo: " + WASTE[res.material].name.toLowerCase() + " " + Math.round(res.prob * 100) + "%"
        : "Acerca un residuo al recuadro";
      if (res && res.material === streak.material) streak.count += 1;
      else streak = { material: res ? res.material : null, count: res ? 1 : 0 };
      if (res && streak.count >= CONFIG.FRAMES_NEEDED && phase === "searching") startLocating(res);
    } catch {
      /* un cuadro que falla no detiene la IA */
    } finally {
      analyzing = false;
    }
  }, CONFIG.AI_INTERVAL_MS);
}

/* ---------- Bote real: encontrar su QR en la imagen ---------- */
async function loadQrReader() {
  if ("BarcodeDetector" in window) {
    try {
      const formats = await window.BarcodeDetector.getSupportedFormats();
      if (formats.includes("qr_code")) {
        qr = { kind: "native", detector: new window.BarcodeDetector({ formats: ["qr_code"] }) };
        return;
      }
    } catch { /* se usa jsQR */ }
  }
  await loadScript(CONFIG.JSQR_URL);
  qr = { kind: "jsqr" };
}

/** Devuelve [{ text, points:[{x,y}×4] }] en pixeles del video. */
async function readQrCodes() {
  const video = $("video");
  if (!cameraReady || video.readyState < 2) return [];
  if (qr.kind === "native") {
    const codes = await qr.detector.detect(video);
    return codes.map((c) => ({ text: c.rawValue, points: c.cornerPoints || boxToPoints(c.boundingBox) }));
  }
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(1, 720 / Math.max(vw, vh));
  const canvas = $("qrCanvas");
  canvas.width = Math.round(vw * scale);
  canvas.height = Math.round(vh * scale);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
  if (!code) return [];
  const l = code.location;
  return [{
    text: code.data,
    points: [l.topLeftCorner, l.topRightCorner, l.bottomRightCorner, l.bottomLeftCorner]
      .map((p) => ({ x: p.x / scale, y: p.y / scale })),
  }];
}
function boxToPoints(b) {
  return [{ x: b.x, y: b.y }, { x: b.x + b.width, y: b.y }, { x: b.x + b.width, y: b.y + b.height }, { x: b.x, y: b.y + b.height }];
}

/* Convierte puntos del video a la pantalla (el video usa object-fit: cover) */
function toScreenRect(points) {
  const video = $("video");
  const vw = video.videoWidth, vh = video.videoHeight;
  const ew = video.clientWidth, eh = video.clientHeight;
  const scale = Math.max(ew / vw, eh / vh);
  const ox = (ew - vw * scale) / 2, oy = (eh - vh * scale) / 2;
  const xs = points.map((p) => ox + p.x * scale);
  const ys = points.map((p) => oy + p.y * scale);
  const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
  const pad = (x2 - x1) * 0.18;
  return { left: x1 - pad, top: y1 - pad, width: x2 - x1 + pad * 2, height: y2 - y1 + pad * 2 };
}

function startQrLoop() {
  clearInterval(qrTimer);
  qrTimer = setInterval(async () => {
    if (phase !== "locating" || scanningQr) return;
    scanningQr = true;
    try {
      const codes = (await readQrCodes())
        .map((c) => ({ ...c, bin: parseBin(c.text) }))
        .filter((c) => c.bin);
      if (!codes.length) {
        if (Date.now() - lastSeen > CONFIG.LOST_MS) hideMarker();
        return;
      }
      // Si se ven varios botes, primero el correcto
      const target = WASTE[current.material].bin;
      const pick = codes.find((c) => c.bin.bin === target) || codes[0];
      lastSeen = Date.now();
      showMarker(pick, pick.bin.bin === target);
    } catch {
      /* un cuadro que falla no detiene la búsqueda */
    } finally {
      scanningQr = false;
    }
  }, CONFIG.QR_INTERVAL_MS);
}

function showMarker(code, correct) {
  const m = $("marker");
  const r = toScreenRect(code.points);
  Object.assign(m.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  m.classList.toggle("bad", !correct);
  const binName = code.bin.bin ? BINS[code.bin.bin].name : code.bin.id;
  $("markerTag").textContent = correct ? "✓ Tíralo aquí" : "✕ Aquí no: " + binName;
  m.hidden = false;

  if (correct) {
    if (!found && navigator.vibrate) navigator.vibrate([60, 40, 60]);
    found = { id: code.bin.id, bin: code.bin.bin };
    updateLocatingSheet("ok");
  } else if (!found) {
    updateLocatingSheet("wrong", binName);
  }
}

function hideMarker() {
  $("marker").hidden = true;
}

/* ---------- Fases ---------- */
function search() {
  phase = "searching";
  current = null;
  found = null;
  streak = { material: null, count: 0 };
  hideMarker();
  $("goal").hidden = true;
  const reticle = $("reticle");
  reticle.hidden = false;
  reticle.classList.add("searching");
  showSearching();
}

function startLocating(res) {
  phase = "locating";
  current = { material: res.material, prob: res.prob };
  found = null;
  lastSeen = 0;
  const w = WASTE[res.material];
  $("reticle").hidden = true;
  $("live").hidden = true;
  const goal = $("goal");
  goal.textContent = `${w.icon} ${w.name} · ${Math.round(res.prob * 100)}% → ${BINS[w.bin].name}`;
  goal.hidden = false;
  if (navigator.vibrate) navigator.vibrate(60);
  updateLocatingSheet("looking");
}

/* ---------- Panel inferior ---------- */
function showLoading() {
  $("sheet").innerHTML = `
    <h2>Preparando la IA…</h2>
    <p id="loadText">Cargando el motor de IA…</p>
    <div class="bar"><div id="loadBar"></div></div>`;
  fitSheet();
}

function showSearching() {
  const hint = ai && ai.kind === "general"
    ? "La IA general reconoce botellas y cartón. Para latas, usa el modelo EcoRA (⚙)."
    : "Pon el residuo dentro del recuadro, con buena luz.";
  $("sheet").innerHTML = `<h2>1. Muestra tu residuo</h2><p>${hint}</p>`;
  fitSheet();
}

let lastSheetState = "";
function updateLocatingSheet(state, binName) {
  const key = state + (binName || "");
  if (key === lastSheetState && $("doneBtn")) return;
  lastSheetState = key;
  const w = WASTE[current.material];
  const target = BINS[w.bin].name;
  let status = `<p>Apunta la cámara al bote. La flecha aparece sobre el de <strong>${target}</strong>.</p>`;
  if (state === "wrong") status = `<p class="warn">Ese es el bote de ${binName}. Busca el de ${target}.</p>`;
  if (state === "ok") status = `<p class="ok">¡Ese es! Tira tu ${w.name.toLowerCase()} en este bote.</p>`;
  $("sheet").innerHTML = `
    <h2>2. Busca el bote de ${target}</h2>
    ${status}
    <p class="tip">💡 ${w.tip}</p>
    <div class="row">
      <button class="btn secondary" type="button" id="againBtn">Otro residuo</button>
      <button class="btn" type="button" id="doneBtn" ${found ? "" : "disabled"}>Ya lo tiré +20</button>
    </div>`;
  $("againBtn").addEventListener("click", () => { lastSheetState = ""; search(); });
  $("doneBtn").addEventListener("click", registerPoints);
  fitSheet();
}

function showResult(title, text, linkToAccount) {
  phase = "done";
  lastSheetState = "";
  hideMarker();
  $("goal").hidden = true;
  $("sheet").innerHTML = `
    <h2>${title}</h2>
    <p>${text}</p>
    ${linkToAccount ? '<a class="btn secondary" href="index.html#cuenta">Ir a mi cuenta</a>' : ""}
    <button class="btn" type="button" id="againBtn">Otro residuo</button>`;
  $("againBtn").addEventListener("click", search);
  fitSheet();
}

function showError(text) {
  phase = "error";
  $("sheet").innerHTML = `
    <h2>No se pudo cargar la IA</h2>
    <p>${text}</p>
    <button class="btn" type="button" id="retryBtn">Intentar de nuevo</button>`;
  $("retryBtn").addEventListener("click", () => location.reload());
  fitSheet();
}

function showSettings() {
  const saved = storageGet(CONFIG.MODEL_KEY);
  const before = phase;
  if (phase === "searching" || phase === "locating") phase = "paused";
  hideMarker();
  $("sheet").innerHTML = `
    <h2>Modelo de IA</h2>
    <p>Ahora: <strong>${ai && ai.kind === "ecora" ? "modelo EcoRA (Teachable Machine)" : "IA general (MobileNet)"}</strong></p>
    <label for="modelInput">Enlace del modelo de Teachable Machine</label>
    <input class="field" id="modelInput" placeholder="https://teachablemachine.withgoogle.com/models/…" value="${saved}">
    <p id="modelNote"></p>
    <div class="row">
      <button class="btn secondary" type="button" id="generalBtn">Usar IA general</button>
      <button class="btn" type="button" id="saveModelBtn">Guardar</button>
    </div>
    <button class="btn secondary" type="button" id="closeBtn">Cerrar</button>`;
  $("saveModelBtn").addEventListener("click", () => {
    const url = normalizeModelUrl($("modelInput").value);
    if (!url) {
      $("modelNote").textContent = "Ese enlace no es de Teachable Machine. Debe empezar con https://teachablemachine.withgoogle.com/models/";
      return;
    }
    storageSet(CONFIG.MODEL_KEY, url);
    location.reload();
  });
  $("generalBtn").addEventListener("click", () => { storageSet(CONFIG.MODEL_KEY, ""); location.reload(); });
  $("closeBtn").addEventListener("click", () => {
    lastSheetState = "";
    if (before === "locating" && current) { phase = "locating"; updateLocatingSheet(found ? "ok" : "looking"); }
    else if (before === "loading") showLoading();
    else search();
  });
  fitSheet();
}

function popPoints(text) {
  const el = document.createElement("div");
  el.className = "pop";
  el.textContent = text;
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ---------- Puntos reales (sesión de la página principal) ---------- */
function getToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
    return saved && saved.token ? saved.token : "";
  } catch {
    return "";
  }
}

async function registerPoints() {
  if (busy || !current || !found) return;
  const token = getToken();
  if (!token) {
    showResult("¡Bien hecho!", "Para que estos puntos cuenten, primero entra a tu cuenta en la página de EcoRA.", true);
    return;
  }
  busy = true;
  const btn = $("doneBtn");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "registrar", token, bote: found.id }),
      signal: controller.signal,
    }).then((r) => r.json());

    if (res.sesion === false) {
      showResult("Tu sesión terminó", "Vuelve a entrar en la página de EcoRA para sumar puntos.", true);
    } else if (res.ok) {
      popPoints("+" + (res.puntos || 20));
      showResult("¡+" + (res.puntos || 20) + " puntos!", "Ya llevas " + res.saldo + " puntos. Cada acción cuenta.");
    } else {
      showResult("Un momento", res.error || "No se pudo registrar. Intenta de nuevo.");
    }
  } catch {
    showResult("Sin conexión", "No se pudo guardar el registro. Revisa el internet e intenta de nuevo.");
  } finally {
    clearTimeout(timer);
    busy = false;
  }
}

/* ---------- Arranque ---------- */
async function init() {
  $("settingsBtn").addEventListener("click", showSettings);
  window.addEventListener("resize", fitSheet);
  showLoading();
  const camera = startCamera();
  try {
    await loadAI();
  } catch {
    showError("Revisa que tengas internet: la IA se descarga la primera vez que abres la página.");
    return;
  }
  await camera;
  if (phase === "loading") search();
  startAiLoop();
  startQrLoop();
}

init();
</script>
