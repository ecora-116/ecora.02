<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoRA | Asistente RA</title>
<meta name="description" content="Simulación del asistente de Realidad Aumentada de EcoRA.">
<style>
:root {
  --green: #247653;
  --dark: #173d30;
  --lime: #8bc34a;
  --soft: #dce9b7;
  --text: #25352d;
  --muted: #6b7a71;
  --sheet-h: 240px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0d1f18; color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

.stage { position: fixed; inset: 0; overflow: hidden; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fake-cam {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 85%, #3c5a4b 0, transparent 55%),
    linear-gradient(180deg, #24372f 0%, #33473d 55%, #4a5e52 100%);
}
.fake-cam::after {
  content: ""; position: absolute; left: 0; right: 0; top: 58%; height: 2px;
  background: rgba(255, 255, 255, .08);
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.5) 0, transparent 20%, transparent 50%, rgba(0,0,0,.45) 100%);
}

/* Barra superior */
.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.back {
  color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
  background: rgba(0, 0, 0, .38); padding: 9px 14px; border-radius: 999px;
  backdrop-filter: blur(6px);
}
.badge {
  font-size: 11px; font-weight: 800; letter-spacing: 1.2px;
  background: rgba(139, 195, 74, .92); color: var(--dark);
  padding: 6px 10px; border-radius: 999px;
}

/* Visor */
.reticle {
  position: absolute; left: 50%; top: calc((100% - var(--sheet-h)) * .42);
  width: min(56vw, 250px); aspect-ratio: 1; transform: translate(-50%, -50%);
  z-index: 3; transition: transform .3s;
}
.reticle i {
  position: absolute; width: 22%; height: 22%;
  border: 4px solid rgba(255, 255, 255, .9);
  transition: border-color .3s;
}
.reticle i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.reticle i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.reticle i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.reticle i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
.reticle .scanline {
  position: absolute; left: 8%; right: 8%; height: 3px; top: 8%; opacity: 0;
  background: var(--lime); box-shadow: 0 0 14px 2px var(--lime); border-radius: 3px;
}
.reticle.scanning .scanline { opacity: 1; animation: scan 1.1s ease-in-out infinite; }
.reticle.found i { border-color: var(--lime); }
.reticle.found { transform: translate(-50%, -50%) scale(.94); }
@keyframes scan { 0%, 100% { top: 8%; } 50% { top: 90%; } }

.label-chip {
  position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
  white-space: nowrap; background: #fff; color: var(--dark);
  font-weight: 800; font-size: 15px; padding: 8px 14px; border-radius: 999px;
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .6);
  animation: chipIn .35s ease-out;
}
.label-chip small { color: var(--green); font-weight: 800; margin-left: 6px; }
@keyframes chipIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* Botes virtuales */
.bins {
  position: absolute; left: 0; right: 0; bottom: calc(var(--sheet-h) + 14px); z-index: 2;
  display: flex; justify-content: center; align-items: flex-end; gap: 6vw;
  perspective: 700px;
}
.vbin {
  position: relative; width: min(22vw, 92px); height: min(27vw, 112px);
  border-radius: 10px 10px 16px 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transform: rotateX(16deg); transform-origin: bottom center;
  box-shadow: 0 20px 26px -14px rgba(0, 0, 0, .8);
  transition: opacity .35s, filter .35s, transform .35s, box-shadow .35s;
  font-size: min(7vw, 30px);
}
.vbin::before {
  content: ""; position: absolute; top: -9px; left: -6px; right: -6px; height: 15px;
  border-radius: 8px; background: inherit; filter: brightness(.88);
}
.vbin span { font-size: 10px; font-weight: 800; letter-spacing: .6px; color: #fff; }
.vbin.plastico { background: #F2C230; }
.vbin.plastico span { color: #3a2e05; }
.vbin.metal { background: #8A9BA8; }
.vbin.papel { background: #2F7FD1; }
.vbin.dim { opacity: .35; filter: grayscale(.7); }
.vbin.target {
  transform: rotateX(16deg) scale(1.1);
  box-shadow: 0 0 0 4px var(--lime), 0 0 34px 8px rgba(139, 195, 74, .65);
}

.arrow {
  position: absolute; left: 50%; bottom: calc(100% + 18px);
  width: 54px; height: 80px; transform: translateX(-50%);
  animation: bob .9s ease-in-out infinite;
  filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .55));
}
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -16px); } }

/* Panel inferior */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  background: #fff; color: var(--text);
  border-radius: 22px 22px 0 0;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -12px 30px rgba(0, 0, 0, .3);
  max-width: 560px; margin: 0 auto;
}
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips small { font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 2px; }
.chip {
  border: 1px solid #e3e9df; background: #f7faf4; color: var(--dark);
  padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700;
}
.chip.on { background: var(--dark); border-color: var(--dark); color: #fff; }
.sheet h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.3px; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.sheet .tip { margin-top: 8px; color: var(--green); font-weight: 600; }
.btn {
  display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 14px;
  background: var(--green); color: #fff; font-weight: 800; font-size: 16px; text-align: center; text-decoration: none;
}
.btn:disabled { background: #b9c6bd; cursor: not-allowed; }
.btn.secondary { background: #eef3ea; color: var(--dark); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.note { font-size: 12px !important; margin-top: 10px !important; }

.pop {
  position: absolute; left: 50%; top: 36%; z-index: 7; pointer-events: none;
  font-size: 46px; font-weight: 900; color: var(--lime);
  text-shadow: 0 4px 22px rgba(0, 0, 0, .7);
  animation: pop 1.5s ease-out forwards;
}
@keyframes pop {
  0%   { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
  20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="fake-cam" id="fakeCam"></div>
  <video id="video" playsinline muted hidden></video>
  <div class="shade"></div>

  <header class="top">
    <a class="back" href="index.html">← EcoRA</a>
    <span class="badge">SIMULACIÓN RA</span>
  </header>

  <div class="reticle" id="reticle" aria-hidden="true">
    <i></i><i></i><i></i><i></i>
    <div class="scanline"></div>
  </div>

  <div class="bins" id="bins" aria-label="Botes virtuales">
    <div class="vbin plastico" data-bin="plastico">🧴<span>PLÁSTICOS</span></div>
    <div class="vbin metal" data-bin="metal">🥫<span>METALES</span></div>
    <div class="vbin papel" data-bin="papel">📦<span>PAPEL</span></div>
  </div>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5e88f"/>
      <stop offset="1" stop-color="#5aa02c"/>
    </linearGradient>
  </defs>
</svg>

<script>
"use strict";

/* Misma URL y sesión que la página principal */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz28oW8ic4iomKXCYPQ2XBXL5c_rwYW8ZHi0iL6apFqsItBJlhXuBQ7_2RfuPZlo5Qt/exec";
const STORAGE_KEY = "ecora.web.v3";

const WASTE = {
  pet:      { name: "Botella PET",      icon: "🧴", bin: "plastico", binName: "Plásticos",      binId: "ECORA-PLASTICO", tip: "Vacíala y aplástala antes de tirarla." },
  aluminio: { name: "Lata de aluminio", icon: "🥫", bin: "metal",    binName: "Metales",        binId: "ECORA-METAL",    tip: "Enjuágala y aplástala para que ocupe menos." },
  carton:   { name: "Cartón",           icon: "📦", bin: "papel",    binName: "Papel y cartón", binId: "ECORA-PAPEL",    tip: "Dóblalo y revisa que esté seco y limpio." },
};
const ORDER = ["pet", "aluminio", "carton"];
const ARROW_SVG =
  '<svg class="arrow" viewBox="0 0 54 80" aria-hidden="true">' +
  '<path d="M17 2h20v42h15L27 78 2 44h15z" fill="url(#arrowGrad)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';

const $ = (id) => document.getElementById(id);
let selected = "pet";
let current = null;
let busy = false;

/* ---------- Cámara ---------- */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    const video = $("video");
    video.srcObject = stream;
    video.hidden = false;
    try { await video.play(); } catch { /* algunos navegadores lo inician solos */ }
    $("fakeCam").hidden = true;
  } catch {
    /* Sin permiso de cámara: se queda el fondo simulado y la demo sigue funcionando. */
  }
}

/* ---------- Panel inferior ---------- */
function chipsHTML() {
  return '<div class="chips"><small>Residuo para la demo:</small>' +
    ORDER.map((k) => `<button class="chip${k === selected ? " on" : ""}" type="button" data-pick="${k}">${WASTE[k].icon} ${WASTE[k].name.split(" ")[0] === "Lata" ? "Lata" : WASTE[k].name}</button>`).join("") +
    "</div>";
}

function showIdle() {
  current = null;
  resetScene();
  $("sheet").innerHTML = chipsHTML() + `
    <h2>Apunta a un residuo</h2>
    <p>La IA reconoce el material y te señala en qué bote va.</p>
    <button class="btn" type="button" id="scanBtn">Escanear residuo</button>`;
  $("scanBtn").addEventListener("click", scan);
  fitSheet();
}

function showScanning() {
  $("sheet").innerHTML = `
    <h2>Analizando…</h2>
    <p>Reconociendo el material del residuo.</p>
    <button class="btn" type="button" disabled>Escaneando</button>`;
  fitSheet();
}

function showDetected(w) {
  $("sheet").innerHTML = `
    <h2>${w.icon} ${w.name}</h2>
    <p>Va en el bote de <strong>${w.binName}</strong>. Sigue la flecha.</p>
    <p class="tip">💡 ${w.tip}</p>
    <div class="row">
      <button class="btn secondary" type="button" id="againBtn">Escanear otro</button>
      <button class="btn" type="button" id="doneBtn">Ya lo tiré +20</button>
    </div>`;
  $("againBtn").addEventListener("click", nextWaste);
  $("doneBtn").addEventListener("click", registerPoints);
  fitSheet();
}

function showResult(title, text, linkToAccount) {
  $("sheet").innerHTML = `
    <h2>${title}</h2>
    <p>${text}</p>
    ${linkToAccount ? '<a class="btn secondary" href="index.html#cuenta">Ir a mi cuenta</a>' : ""}
    <button class="btn" type="button" id="againBtn">Escanear otro</button>`;
  $("againBtn").addEventListener("click", nextWaste);
  fitSheet();
}

function fitSheet() {
  $("stage").style.setProperty("--sheet-h", $("sheet").offsetHeight + "px");
}

/* ---------- Escena ---------- */
function resetScene() {
  const reticle = $("reticle");
  reticle.classList.remove("scanning", "found");
  reticle.querySelectorAll(".label-chip").forEach((el) => el.remove());
  document.querySelectorAll(".vbin").forEach((b) => {
    b.classList.remove("dim", "target");
    b.querySelectorAll(".arrow").forEach((a) => a.remove());
  });
}

function scan() {
  if (busy) return;
  busy = true;
  resetScene();
  $("reticle").classList.add("scanning");
  showScanning();

  setTimeout(() => {
    const w = WASTE[selected];
    current = w;
    const reticle = $("reticle");
    reticle.classList.remove("scanning");
    reticle.classList.add("found");

    const chip = document.createElement("div");
    chip.className = "label-chip";
    chip.innerHTML = `${w.icon} ${w.name}<small>${90 + Math.floor(Math.random() * 8)}%</small>`;
    reticle.appendChild(chip);

    document.querySelectorAll(".vbin").forEach((b) => {
      const isTarget = b.dataset.bin === w.bin;
      b.classList.toggle("target", isTarget);
      b.classList.toggle("dim", !isTarget);
      if (isTarget) b.insertAdjacentHTML("beforeend", ARROW_SVG);
    });

    if (navigator.vibrate) navigator.vibrate(60);
    showDetected(w);
    busy = false;
  }, 1400);
}

function nextWaste() {
  if (current) selected = ORDER[(ORDER.indexOf(selected) + 1) % ORDER.length];
  showIdle();
}

function popPoints(text) {
  const el = document.createElement("div");
  el.className = "pop";
  el.textContent = text;
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ---------- Puntos reales (si hay sesión abierta en la página principal) ---------- */
function getToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return saved && saved.token ? saved.token : "";
  } catch {
    return "";
  }
}

async function registerPoints() {
  if (busy || !current) return;
  const token = getToken();
  if (!token) {
    showResult("¡Bien hecho!", "Para que estos puntos cuenten, primero entra a tu cuenta en la página de EcoRA.", true);
    return;
  }

  busy = true;
  const btn = $("doneBtn");
  btn.disabled = true;
  btn.textContent = "Guardando…";

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "registrar", token, bote: current.binId }),
      signal: controller.signal,
    }).then((r) => r.json());

    if (res.sesion === false) {
      showResult("Tu sesión terminó", "Vuelve a entrar en la página de EcoRA para sumar puntos.", true);
    } else if (res.ok) {
      popPoints("+" + (res.puntos || 20));
      showResult("¡+" + (res.puntos || 20) + " puntos!", "Ya llevas " + res.saldo + " puntos. Cada acción cuenta.");
    } else {
      showResult("Un momento", res.error || "No se pudo registrar. Intenta de nuevo.");
    }
  } catch {
    showResult("Sin conexión", "No se pudo guardar el registro. Revisa el internet e intenta de nuevo.");
  } finally {
    clearTimeout(timer);
    busy = false;
  }
}

/* ---------- Arranque ---------- */
$("sheet").addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (!pick) return;
  selected = pick.dataset.pick;
  showIdle();
});

// Atajos para presentar desde la computadora: 1, 2, 3 eligen residuo; Espacio escanea.
document.addEventListener("keydown", (e) => {
  if (e.key === "1" || e.key === "2" || e.key === "3") {
    selected = ORDER[Number(e.key) - 1];
    showIdle();
  } else if (e.key === " " && !current && !busy) {
    e.preventDefault();
    scan();
  }
});

window.addEventListener("resize", fitSheet);
showIdle();
startCamera();
</script>
</body>
</html>
