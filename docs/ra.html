<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoRA | Asistente RA</title>
<meta name="description" content="Asistente de EcoRA: la IA encuentra el bote con la cámara y te lo señala.">
<link rel="icon" type="image/png" href="img/icono.png">
<style>
:root {
  --green: #247653;
  --dark: #173d30;
  --lime: #8bc34a;
  --red: #e0533d;
  --text: #25352d;
  --muted: #6b7a71;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0d1f18; color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.stage { position: fixed; inset: 0; overflow: hidden; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.no-cam {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center;
  background: linear-gradient(180deg, #24372f 0%, #33473d 60%, #4a5e52 100%); color: #d6e2d8;
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0, transparent 18%, transparent 60%, rgba(0,0,0,.35) 100%);
}
#debug { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

/* Barra superior */
.top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 8;
  display: flex; align-items: center; gap: 8px;
  padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
}
.pill {
  color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; border: 0;
  background: rgba(0, 0, 0, .38); padding: 9px 13px; border-radius: 999px; backdrop-filter: blur(6px);
}
.pill.on { background: var(--lime); color: var(--dark); }
.spacer { flex: 1; }
.badge {
  font-size: 11px; font-weight: 800; letter-spacing: 1px; white-space: nowrap;
  background: rgba(139, 195, 74, .92); color: var(--dark); padding: 6px 10px; border-radius: 999px;
}
.live {
  position: absolute; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%);
  z-index: 5; white-space: nowrap; font-size: 13px; font-weight: 700;
  background: rgba(0, 0, 0, .5); padding: 7px 13px; border-radius: 999px;
}

/* Marca sobre el bote real (la coloca la IA) */
.marker {
  position: absolute; z-index: 4; pointer-events: none;
  border: 5px solid var(--lime); border-radius: 22px;
  box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 0 30px 6px rgba(139, 195, 74, .55);
  transition: left .25s ease-out, top .25s ease-out, width .25s ease-out, height .25s ease-out;
}
.marker .tag {
  position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%);
  white-space: nowrap; font-size: 15px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
  background: var(--lime); color: var(--dark); box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
}
.marker.flip .arrow { bottom: auto; top: calc(100% + 10px); }
.marker.flip .tag { top: auto; bottom: calc(100% + 10px); }
.marker.low .tag { top: auto; bottom: 8px; }
.marker .arrow {
  position: absolute; left: 50%; bottom: calc(100% + 10px);
  width: 64px; height: 94px; transform: translateX(-50%);
  animation: bob .9s ease-in-out infinite; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .55));
}
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -16px); } }

/* Panel inferior */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  background: #fff; color: var(--text); border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -12px 30px rgba(0, 0, 0, .3); max-width: 560px; margin: 0 auto;
}
.sheet h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.3px; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.sheet .ok { margin-top: 6px; color: var(--green); font-weight: 800; }
.sheet label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; color: var(--text); }
.field {
  width: 100%; padding: 12px; border: 1px solid #e3e9df; border-radius: 12px;
  background: #fbfcfa; color: var(--text); font-size: 14px;
}
.btn {
  display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 14px;
  background: var(--green); color: #fff; font-weight: 800; font-size: 16px; text-align: center; text-decoration: none;
}
.btn:disabled { background: #b9c6bd; cursor: not-allowed; }
.btn.secondary { background: #eef3ea; color: var(--dark); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.bar { height: 8px; border-radius: 999px; background: #e8eee5; overflow: hidden; margin-top: 12px; }
.bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--lime)); transition: width .3s; }

.pop {
  position: absolute; left: 50%; top: 36%; z-index: 7; pointer-events: none;
  font-size: 46px; font-weight: 900; color: var(--lime);
  text-shadow: 0 4px 22px rgba(0, 0, 0, .7); animation: pop 1.5s ease-out forwards;
}
@keyframes pop {
  0%   { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
  20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <div class="no-cam" id="noCam" hidden><p id="noCamText">No pudimos abrir la cámara.</p></div>
  <div class="shade"></div>
  <canvas id="debug"></canvas>
  <canvas id="crop" width="224" height="224" hidden></canvas>

  <header class="top">
    <a class="pill" href="index.html">← EcoRA</a>
    <span class="spacer"></span>
    <span class="badge" id="badge">IA</span>
    <button class="pill" type="button" id="debugBtn" aria-pressed="false" title="Ver lo que ve la IA">👁</button>
    <button class="pill" type="button" id="settingsBtn" aria-label="Modelo de IA">⚙</button>
  </header>

  <div class="live" id="live" hidden></div>

  <div class="marker" id="marker" hidden aria-hidden="true">
    <svg class="arrow" viewBox="0 0 54 80">
      <defs>
        <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c5e88f"/>
          <stop offset="1" stop-color="#5aa02c"/>
        </linearGradient>
      </defs>
      <g id="arrowG"><path d="M17 2h20v42h15L27 78 2 44h15z" fill="url(#arrowGrad)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
    </svg>
    <div class="tag">Tira aquí tu basura</div>
  </div>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<script>
"use strict";

/* ==========================================================
   EcoRA · Asistente RA
   La IA busca el bote en la imagen de la cámara y pone una flecha encima.

   Cómo ubica el bote: divide lo que ve la cámara en pedazos (una
   cuadrícula), le pregunta a la IA "¿hay un bote aquí?" en cada pedazo,
   y pone la flecha donde las respuestas son más altas.

   - Modelo EcoRA (Teachable Machine, clases "Bote" y "Nada"), si se pegó su enlace en ⚙.
   - Si no, la IA general (MobileNet), que ya conoce los botes de basura.
   ========================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz28oW8ic4iomKXCYPQ2XBXL5c_rwYW8ZHi0iL6apFqsItBJlhXuBQ7_2RfuPZlo5Qt/exec",
  STORAGE_KEY: "ecora.web.v3",      // misma sesión que la página principal
  MODEL_KEY: "ecora.tm.model",      // enlace del modelo de Teachable Machine
  BIN_ID: "ECORA-PROTOTIPO",        // código del bote con el que se guardan los puntos
  TF_URL: "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js",
  MOBILENET_URL: "https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js",
  INTERVAL_MS: 250,      // pausa entre revisiones de la cámara
  COLS: 3,               // columnas de la cuadrícula
  TILE: 0.55,            // tamaño de cada pedazo (parte del lado corto de la imagen)
  MIN_TM: 0.75,          // seguridad mínima con el modelo EcoRA
  MIN_GENERAL: 0.18,     // seguridad mínima con la IA general
  HITS_NEEDED: 2,        // revisiones seguidas viendo el bote para mostrar la flecha
  MIN_THROW: 0.75,       // seguridad mínima para "Tirando"
  THROW_HITS: 2,         // revisiones seguidas viendo "Tirando" para sumar los puntos solos
  LOST_MS: 1200,         // si deja de verlo este tiempo, quita la flecha
};

/* Clases de la IA general (ImageNet) que cuentan como bote de basura */
const GENERAL_BIN_WORDS = ["ashcan", "trash can", "garbage can", "wastebin", "dustbin", "trash barrel", "trash bin"];
/* Nombres de clase del modelo EcoRA que cuentan como bote */
const TM_BIN_WORDS = /bote|basura|contenedor|cesto|bin|trash/;
/* Nombres de clase del modelo EcoRA que cuentan como "están tirando basura" */
const TM_THROW_WORDS = /tir|deposit|echa|arroj|throw/;

const $ = (id) => document.getElementById(id);

let phase = "loading";    // loading | searching | paused | done | error
let ai = null;            // { kind: "general" | "ecora", net, binIndex? }
let cameraReady = false;
let loopTimer = null;
let analyzing = false;
let debugOn = false;
let hits = 0;
let throwHits = 0;
let lastSeen = 0;
let seenOnce = false;
let box = null;           // posición suavizada del bote en el video {cx, cy, s}
let lastTiles = [];
let busy = false;

/* ---------- Utilidades ---------- */
function loadScript(url) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${url}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error("No se pudo cargar " + url));
    document.head.appendChild(s);
  });
}
function storageGet(key) { try { return localStorage.getItem(key) || ""; } catch { return ""; } }
function storageSet(key, value) {
  try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch { /* sin almacenamiento */ }
}
function normalizeModelUrl(raw) {
  let url = String(raw || "").trim();
  if (!url) return "";
  if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[A-Za-z0-9_-]+\/?/.test(url)) return null;
  url = url.split(/[?#]/)[0].replace(/(model\.json|metadata\.json)$/, "");
  return url.endsWith("/") ? url : url + "/";
}
/* El enlace del modelo también puede venir en la dirección: ra.html?modelo=https://teachablemachine... */
function getModelUrl() {
  const param = new URLSearchParams(location.search).get("modelo");
  if (param === "general") storageSet(CONFIG.MODEL_KEY, "");
  else if (param) {
    const url = normalizeModelUrl(param);
    if (url) storageSet(CONFIG.MODEL_KEY, url);
  }
  return storageGet(CONFIG.MODEL_KEY);
}
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

/* ---------- Cámara ---------- */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showNoCam("Este navegador no permite usar la cámara. Abre la página en Chrome.");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    const video = $("video");
    video.srcObject = stream;
    try { await video.play(); } catch { /* algunos navegadores lo inician solos */ }
    cameraReady = true;
  } catch {
    showNoCam("No pudimos abrir la cámara. Toca el candado junto a la dirección y permite la cámara.");
  }
}
function showNoCam(text) {
  $("noCamText").textContent = text;
  $("noCam").hidden = false;
}

/* ---------- Cargar la IA ---------- */
async function loadAI() {
  const bar = (pct, text) => {
    const b = $("loadBar"); if (b) b.style.width = pct + "%";
    const t = $("loadText"); if (t && text) t.textContent = text;
  };
  bar(10, "Cargando el motor de IA…");
  await loadScript(CONFIG.TF_URL);
  await window.tf.ready();

  const modelUrl = getModelUrl();
  if (modelUrl) {
    try {
      bar(45, "Cargando el modelo EcoRA…");
      const net = await window.tf.loadLayersModel(modelUrl + "model.json");
      const meta = await fetch(modelUrl + "metadata.json").then((r) => r.json());
      const labels = meta.labels || [];
      const throwIndex = labels.findIndex((l) => TM_THROW_WORDS.test(norm(l)));
      const binIndex = labels.findIndex((l, i) => i !== throwIndex && TM_BIN_WORDS.test(norm(l)));
      if (binIndex < 0) throw new Error("El modelo no tiene una clase llamada Bote");
      ai = { kind: "ecora", net, binIndex, binLabel: labels[binIndex], throwIndex, throwLabel: labels[throwIndex] };
    } catch {
      ai = null;
    }
  }
  if (!ai) {
    bar(45, "Cargando la IA general…");
    await loadScript(CONFIG.MOBILENET_URL);
    ai = { kind: "general", net: await window.mobilenet.load({ version: 2, alpha: 1.0 }), modelFailed: Boolean(modelUrl) };
  }

  bar(85, "Calentando la IA…");
  await scoreCrop($("crop"));     // la primera pasada es la más lenta
  bar(100);
  $("badge").textContent = ai.kind === "ecora" ? "IA ECORA EN VIVO"
    : ai.modelFailed ? "MODELO ECORA NO CARGÓ" : "IA GENERAL EN VIVO";
}

/** ¿Qué tan seguro está de que hay un bote en esta imagen? (0 a 1) */
async function scoreCrop(canvas) {
  if (ai.kind === "ecora") {
    const tf = window.tf;
    const out = tf.tidy(() => {
      const img = tf.browser.fromPixels(canvas).toFloat();
      return ai.net.predict(img.sub(127.5).div(127.5).expandDims(0));
    });
    const probs = await out.data();
    out.dispose();
    const thr = ai.throwIndex >= 0 ? probs[ai.throwIndex] || 0 : 0;
    // Si están tirando basura, el bote también está ahí
    return { bin: Math.min(1, (probs[ai.binIndex] || 0) + thr), thr };
  }
  const preds = await ai.net.classify(canvas, 10);
  let total = 0;
  preds.forEach((p) => {
    const name = p.className.toLowerCase();
    if (GENERAL_BIN_WORDS.some((w) => name.includes(w))) total += p.probability;
  });
  return { bin: Math.min(total, 1), thr: 0 };   // la IA general no sabe si están tirando basura
}

/* ---------- Buscar el bote: revisar la imagen por pedazos ---------- */
/* Solo se revisa la parte del video que se ve en la pantalla, sin lo que tapa el panel de abajo. */
function visibleArea() {
  const v = $("video");
  const vw = v.videoWidth, vh = v.videoHeight, ew = v.clientWidth, eh = v.clientHeight;
  const scale = Math.max(ew / vw, eh / vh);
  const ox = (ew - vw * scale) / 2, oy = (eh - vh * scale) / 2;
  const topPx = 60;
  const bottomPx = Math.min(eh * 0.45, $("sheet").offsetHeight);
  const w = ew / scale;
  const h = Math.max(eh * 0.3, eh - topPx - bottomPx) / scale;
  return { x: (vw - w) / 2, y: (topPx - oy) / scale, w, h, scale, ox, oy };
}

function makeTiles(area) {
  const s = Math.min(area.w, area.h) * CONFIG.TILE;
  const cols = CONFIG.COLS;
  const rows = Math.max(2, Math.min(5, Math.round(cols * area.h / area.w)));
  const tiles = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cx = area.x + s / 2 + (cols === 1 ? 0 : (area.w - s) * c / (cols - 1));
      const cy = area.y + s / 2 + (rows === 1 ? 0 : (area.h - s) * r / (rows - 1));
      tiles.push({ cx, cy, s });
    }
  }
  // Un pedazo grande al centro, por si el bote está cerca y llena la pantalla
  const big = Math.min(area.w, area.h) * 0.95;
  tiles.push({ cx: area.x + area.w / 2, cy: area.y + area.h / 2, s: big, big: true });
  return tiles;
}

async function scanFrame() {
  const video = $("video");
  if (!cameraReady || video.readyState < 2 || !video.videoWidth) return null;
  const area = visibleArea();
  const tiles = makeTiles(area);
  const canvas = $("crop");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  for (const t of tiles) {
    ctx.drawImage(video, t.cx - t.s / 2, t.cy - t.s / 2, t.s, t.s, 0, 0, 224, 224);
    const r = await scoreCrop(canvas);
    t.score = r.bin;
    t.thr = r.thr;
  }
  lastTiles = tiles;
  return { area, tiles };
}

/** Junta los pedazos con bote en una sola posición. */
function locate(tiles) {
  const min = ai.kind === "ecora" ? CONFIG.MIN_TM : CONFIG.MIN_GENERAL;
  const small = tiles.filter((t) => !t.big);
  const bigTile = tiles.find((t) => t.big);
  const best = small.reduce((a, b) => (b.score > a.score ? b : a), small[0]);
  let top = best.score;

  if (top < min) {
    // Bote muy cerca: no cabe en un pedazo, pero sí en el grande
    if (bigTile && bigTile.score >= min) return { cx: bigTile.cx, cy: bigTile.cy, s: bigTile.s * 0.8, score: bigTile.score };
    return null;
  }
  const near = small.filter((t) => t.score >= top * 0.5 && t.score >= min * 0.6);
  let wx = 0, wy = 0, ws = 0;
  near.forEach((t) => { const w = t.score * t.score; wx += t.cx * w; wy += t.cy * w; ws += w; });
  const spread = Math.max(...near.map((t) => Math.hypot(t.cx - best.cx, t.cy - best.cy)), 0);
  return { cx: wx / ws, cy: wy / ws, s: best.s * 0.8 + spread * 0.6, score: top };
}

function startLoop() {
  clearTimeout(loopTimer);
  const tick = async () => {
    if (phase === "searching" && !analyzing) {
      analyzing = true;
      try {
        const frame = await scanFrame();
        if (frame) {
          const found = locate(frame.tiles);
          updateFound(found, frame.area);
          checkThrow(frame.tiles);
          if (debugOn) drawDebug(frame.area, frame.tiles);
        }
      } catch {
        /* una revisión que falla no detiene la IA */
      } finally {
        analyzing = false;
      }
    }
    loopTimer = setTimeout(tick, CONFIG.INTERVAL_MS);
  };
  tick();
}

/* ---------- Dibujar la flecha sobre el bote ---------- */
function updateFound(found, area) {
  const live = $("live");
  live.hidden = false;

  if (!found) {
    hits = 0;
    if (Date.now() - lastSeen > CONFIG.LOST_MS) {
      $("marker").hidden = true;
      box = null;
      live.textContent = "Buscando el bote…";
    }
    return;
  }
  hits += 1;
  lastSeen = Date.now();
  live.textContent = "Bote " + Math.round(found.score * 100) + "%";
  // Suaviza el movimiento para que la flecha no tiemble
  box = box
    ? { cx: box.cx * 0.5 + found.cx * 0.5, cy: box.cy * 0.5 + found.cy * 0.5, s: box.s * 0.6 + found.s * 0.4 }
    : { ...found };
  if (hits < CONFIG.HITS_NEEDED && $("marker").hidden) return;

  const m = $("marker");
  const size = box.s * area.scale;
  const x = area.ox + box.cx * area.scale - size / 2;
  const y = area.oy + box.cy * area.scale - size / 2;
  Object.assign(m.style, { left: x + "px", top: y + "px", width: size + "px", height: size + "px" });
  // Si el bote está muy arriba, la flecha va abajo y apunta hacia arriba
  const flip = y < 130;
  m.classList.toggle("flip", flip);
  // Si el bote está muy abajo, el letrero va dentro del recuadro para que no lo tape el panel
  m.classList.toggle("low", !flip && y + size + 50 > $("stage").clientHeight - $("sheet").offsetHeight);
  if (flip) $("arrowG").setAttribute("transform", "rotate(180 27 40)");
  else $("arrowG").removeAttribute("transform");
  m.hidden = false;

  if (!seenOnce) {
    seenOnce = true;
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    showSearching();
  }
}

/* ---------- ¿Ya tiraron la basura? (clase "Tirando" del modelo EcoRA) ---------- */
function checkThrow(tiles) {
  if (!ai || ai.kind !== "ecora" || ai.throwIndex < 0 || phase !== "searching") return;
  const best = Math.max(...tiles.map((t) => t.thr || 0));
  if (best < CONFIG.MIN_THROW) { throwHits = 0; return; }
  throwHits += 1;
  $("live").textContent = "Tirando basura " + Math.round(best * 100) + "%";
  if (throwHits >= CONFIG.THROW_HITS && !busy) {
    seenOnce = true;
    if (navigator.vibrate) navigator.vibrate(120);
    registerPoints(true);
  }
}

function drawDebug(area, tiles) {
  const c = $("debug");
  const rect = c.getBoundingClientRect();
  c.width = rect.width; c.height = rect.height;
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.font = "bold 13px system-ui";
  tiles.filter((t) => !t.big).forEach((t) => {
    const s = t.s * area.scale * 0.42;  // se dibuja más chico para que no se encimen
    const x = area.ox + t.cx * area.scale, y = area.oy + t.cy * area.scale;
    ctx.fillStyle = `rgba(139,195,74,${Math.min(0.65, t.score * 0.75)})`;
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
    ctx.strokeRect(x - s / 2, y - s / 2, s, s);
    ctx.fillStyle = "#fff";
    ctx.fillText(Math.round(t.score * 100) + "%", x - 14, y + 5);
    if (t.thr > 0.3) {
      ctx.fillStyle = "#ffcf5c";
      ctx.fillText("T " + Math.round(t.thr * 100) + "%", x - 18, y + 22);
    }
  });
}

function toggleDebug() {
  debugOn = !debugOn;
  $("debugBtn").classList.toggle("on", debugOn);
  $("debugBtn").setAttribute("aria-pressed", String(debugOn));
  if (!debugOn) { const c = $("debug"); c.getContext("2d").clearRect(0, 0, c.width, c.height); }
  else if (lastTiles.length && cameraReady) drawDebug(visibleArea(), lastTiles);
}

/* ---------- Panel inferior ---------- */
function showLoading() {
  $("sheet").innerHTML = `
    <h2>Preparando la IA…</h2>
    <p id="loadText">Cargando el motor de IA…</p>
    <div class="bar"><div id="loadBar"></div></div>`;
}

function showSearching() {
  phase = "searching";
  const hint = !ai ? ""
    : ai.kind === "ecora" && ai.throwIndex >= 0 ? "Usando nuestro modelo EcoRA: cuando vea que tiras la basura, suma tus puntos solo."
    : ai.kind === "ecora" ? "Usando nuestro modelo EcoRA."
    : ai.modelFailed ? "Su modelo no cargó (revisen el enlace en ⚙ y que tenga la clase Bote). Mientras, uso la IA general."
    : "Usando la IA general. Para que reconozca su bote prototipo, entrenen el modelo EcoRA (⚙).";
  $("sheet").innerHTML = seenOnce ? `
      <h2>¡Ahí está el bote!</h2>
      <p class="ok">Sigue la flecha y tira tu basura.</p>
      <p>${hint}</p>
      <button class="btn" type="button" id="doneBtn">Ya lo tiré +20</button>`
    : `
      <h2>Busca el bote</h2>
      <p>Mueve el celular despacio. Cuando la IA lo encuentre, una flecha te lo va a señalar.</p>
      <p>${hint}</p>
      <button class="btn" type="button" id="doneBtn" disabled>Ya lo tiré +20</button>`;
  $("doneBtn").addEventListener("click", registerPoints);
}

function showResult(title, text, linkToAccount) {
  phase = "done";
  const dbg = $("debug"); dbg.getContext("2d").clearRect(0, 0, dbg.width, dbg.height);
  $("marker").hidden = true;
  $("live").hidden = true;
  $("sheet").innerHTML = `
    <h2>${title}</h2>
    <p>${text}</p>
    ${linkToAccount ? '<a class="btn secondary" href="index.html#cuenta">Ir a mi cuenta</a>' : ""}
    <button class="btn" type="button" id="againBtn">Seguir buscando</button>`;
  $("againBtn").addEventListener("click", () => { seenOnce = false; hits = 0; throwHits = 0; box = null; showSearching(); });
}

function showError(text) {
  phase = "error";
  $("sheet").innerHTML = `
    <h2>No se pudo cargar la IA</h2>
    <p>${text}</p>
    <button class="btn" type="button" id="retryBtn">Intentar de nuevo</button>`;
  $("retryBtn").addEventListener("click", () => location.reload());
}

function showSettings() {
  const saved = storageGet(CONFIG.MODEL_KEY);
  const before = phase;
  if (phase === "searching") phase = "paused";
  const current = ai && ai.kind === "ecora" ? `modelo EcoRA (clase "${ai.binLabel}")` : "IA general (MobileNet)";
  $("sheet").innerHTML = `
    <h2>Modelo de IA</h2>
    <p>Ahora: <strong>${current}</strong></p>
    <label for="modelInput">Enlace del modelo de Teachable Machine</label>
    <input class="field" id="modelInput" placeholder="https://teachablemachine.withgoogle.com/models/…">
    <p id="modelNote">Debe tener una clase llamada <strong>Bote</strong> y otra llamada <strong>Nada</strong>.</p>
    <div class="row">
      <button class="btn secondary" type="button" id="generalBtn">Usar IA general</button>
      <button class="btn" type="button" id="saveModelBtn">Guardar</button>
    </div>
    <button class="btn secondary" type="button" id="closeBtn">Cerrar</button>`;
  $("modelInput").value = saved;
  $("saveModelBtn").addEventListener("click", () => {
    const url = normalizeModelUrl($("modelInput").value);
    if (!url) {
      $("modelNote").textContent = "Ese enlace no es de Teachable Machine. Debe empezar con https://teachablemachine.withgoogle.com/models/";
      return;
    }
    storageSet(CONFIG.MODEL_KEY, url);
    location.reload();
  });
  $("generalBtn").addEventListener("click", () => { storageSet(CONFIG.MODEL_KEY, ""); location.reload(); });
  $("closeBtn").addEventListener("click", () => {
    if (before === "loading") showLoading();
    else if (before === "done") showResult("Listo", "Puedes seguir buscando el bote.");
    else showSearching();
  });
}

function popPoints(text) {
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = '<img src="img/estrella.png" alt="" style="width:54px;height:54px;vertical-align:-10px;margin-right:6px">';
  el.append(text);
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ---------- Puntos reales (sesión de la página principal) ---------- */
function getToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
    return saved && saved.token ? saved.token : "";
  } catch {
    return "";
  }
}

async function registerPoints(auto) {
  if (busy || !seenOnce) return;
  auto = auto === true;   // true cuando la IA vio que tiraste la basura
  const token = getToken();
  if (!token) {
    showResult("¡Bien hecho!", "Para que estos puntos cuenten, primero entra a tu cuenta en la página de EcoRA.", true);
    return;
  }
  busy = true;
  phase = "saving";       // deja de revisar la cámara mientras se guarda
  const btn = $("doneBtn");
  if (btn) { btn.disabled = true; btn.textContent = auto ? "¡Te vi tirar la basura! Guardando…" : "Guardando…"; }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "registrar", token, bote: CONFIG.BIN_ID }),
      signal: controller.signal,
    }).then((r) => r.json());

    if (res.sesion === false) {
      showResult("Tu sesión terminó", "Vuelve a entrar en la página de EcoRA para sumar puntos.", true);
    } else if (res.ok) {
      popPoints("+" + (res.puntos || 20));
      showResult("¡+" + (res.puntos || 20) + " puntos!",
        (auto ? "La IA vio que tiraste tu basura. " : "") + "Ya llevas " + res.saldo + " puntos. Cada acción cuenta.");
    } else {
      showResult("Un momento", res.error || "No se pudo registrar. Intenta de nuevo.");
    }
  } catch {
    showResult("Sin conexión", "No se pudo guardar el registro. Revisa el internet e intenta de nuevo.");
  } finally {
    clearTimeout(timer);
    busy = false;
  }
}

/* ---------- Arranque ---------- */
async function init() {
  $("settingsBtn").addEventListener("click", showSettings);
  $("debugBtn").addEventListener("click", toggleDebug);
  showLoading();
  const camera = startCamera();
  try {
    await loadAI();
  } catch {
    showError("Revisa que tengas internet: la IA se descarga la primera vez que abres la página.");
    return;
  }
  await camera;
  if (phase === "loading") showSearching();
  startLoop();
}

init();
</script>
