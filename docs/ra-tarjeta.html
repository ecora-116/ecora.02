<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAV | RA con tarjeta</title>
<meta name="theme-color" content="#0b2a20">
<style>
  :root { --forest:#0b2a20; --lime:#c6f26b; --cream:#f5f2e9; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; overflow:hidden; }
  #ar { position:fixed; inset:0; }
  #ar video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .top { position:fixed; z-index:5; top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; gap:10px; pointer-events:none; }
  .pill { pointer-events:auto; display:inline-flex; align-items:center; gap:6px; padding:11px 16px; border-radius:999px; background:rgba(11,42,32,.82); color:#fff; font-weight:700; font-size:14px; text-decoration:none; border:0; backdrop-filter:blur(8px); }
  .hint { position:fixed; z-index:5; left:14px; right:14px; bottom:calc(22px + env(safe-area-inset-bottom)); padding:16px 18px; border-radius:24px; background:rgba(11,42,32,.9); backdrop-filter:blur(10px); transition:opacity .3s, transform .3s; }
  .hint b { display:block; font-size:18px; letter-spacing:-.01em; color:var(--lime); }
  .hint span { display:block; margin-top:4px; font-size:14px; line-height:1.4; color:#d6e6dc; }
  .hint.hide { opacity:0; transform:translateY(16px); pointer-events:none; }
  .found { position:fixed; z-index:5; left:50%; top:calc(66px + env(safe-area-inset-top)); transform:translate(-50%,-10px); padding:9px 16px; border-radius:999px; background:var(--lime); color:var(--forest); font-weight:800; font-size:14px; opacity:0; transition:opacity .25s, transform .25s; white-space:nowrap; }
  .found.show { opacity:1; transform:translate(-50%,0); }
  .frame { position:fixed; z-index:4; left:50%; top:46%; width:min(70vw,320px); aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; transition:opacity .3s; }
  .frame i { position:absolute; width:22%; height:22%; border:5px solid var(--lime); }
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:22px 0 0 0}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 22px}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 22px 0}
  .frame.hide { opacity:0; }
  .load { position:fixed; inset:0; z-index:9; display:grid; place-items:center; text-align:center; padding:30px; background:var(--forest); transition:opacity .4s; }
  .load.hide { opacity:0; pointer-events:none; }
  .load h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.03em; }
  .load p { margin:0 auto; max-width:320px; color:#bcd2c5; line-height:1.5; }
  .load .btn { display:inline-block; margin-top:20px; padding:14px 22px; border-radius:999px; background:var(--lime); color:var(--forest); font-weight:800; text-decoration:none; border:0; font-size:16px; }
  .spin { width:46px; height:46px; margin:0 auto 18px; border-radius:50%; border:5px solid rgba(198,242,107,.25); border-top-color:var(--lime); animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
</head>
<body>
<div id="ar" aria-label="Cámara con realidad aumentada"></div>
<div class="top">
  <a class="pill" href="index.html">← RAV</a>
  <a class="pill" href="ar/tarjeta-rav.png" download="tarjeta-RAV.png">Descargar tarjeta</a>
</div>
<div class="frame" id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="found" id="found" role="status">¡Encontré tu tarjeta RAV!</div>
<div class="hint" id="hint" role="status"><b>Apunta a la tarjeta RAV</b><span>Ponla en una mesa o pégala en el bote. La mascota aparece encima y se queda ahí aunque muevas el celular.</span></div>
<div class="load" id="load"><div><div class="spin"></div><h1>Abriendo la RA…</h1><p id="loadMsg">Acepta el permiso de la cámara cuando el celular te lo pida.</p></div></div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "./lib/mindar/mindar-image-three.prod.js";

const $ = id => document.getElementById(id);
const stop = (title, msg) => {
  $("load").classList.remove("hide");
  $("load").innerHTML = `<div><h1>${title}</h1><p>${msg}</p><a class="btn" href="index.html">Volver a RAV</a></div>`;
};
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  stop("Tu navegador no deja usar la cámara", "Abre esta página con Chrome (Android) o Safari (iPhone), y que la dirección empiece con https.");
  throw new Error("sin cámara");
}

/* ---------- Mascota: "Verdi", un bote que se come la basura ---------- */
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .45, metalness: 0, ...o });
function mascota() {
  const g = new THREE.Group();
  const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(.27, .22, .5, 40), M(0x1f9d62));
  cuerpo.position.y = .25; g.add(cuerpo);
  const vientre = new THREE.Mesh(new THREE.CylinderGeometry(.2, .16, .3, 32, 1, false, -.9, 1.8), M(0xc6f26b));
  vientre.position.set(0, .2, .06); vientre.scale.z = 1; g.add(vientre);
  const boca = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .02, 40), M(0x06221a)); boca.position.y = .505; g.add(boca);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(.265, .028, 12, 40), M(0x14774a)); aro.rotation.x = Math.PI / 2; aro.position.y = .505; g.add(aro);
  const tapa = new THREE.Group(); tapa.position.set(0, .51, -.26);
  const tp = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .05, 40), M(0x14774a)); tp.position.z = .26; tapa.add(tp); g.add(tapa);
  for (const x of [-.09, .09]) {
    const o = new THREE.Mesh(new THREE.SphereGeometry(.07, 24, 16), M(0xffffff, { roughness: .2 })); o.position.set(x, .33, .22); o.scale.z = .5; g.add(o);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.035, 16, 12), M(0x06221a)); p.position.set(x, .33, .25); g.add(p);
  }
  const sonrisa = new THREE.Mesh(new THREE.TorusGeometry(.07, .014, 8, 24, Math.PI), M(0x06221a));
  sonrisa.rotation.z = Math.PI; sonrisa.position.set(0, .25, .24); g.add(sonrisa);
  for (const s of [-1, 1]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 12), M(0x14774a)); b.position.set(s * .31, .2, 0); b.scale.set(1, 1.3, 1); g.add(b);
  }
  const emblema = new THREE.Mesh(new THREE.TorusGeometry(.045, .012, 8, 24), M(0x0b2a20)); emblema.position.set(0, .12, .205); g.add(emblema);
  return { g, tapa, cuerpo };
}
function lata() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .17, 24), new THREE.MeshStandardMaterial({ color: 0xdfe6ea, metalness: .9, roughness: .25 })));
  const et = new THREE.Mesh(new THREE.CylinderGeometry(.0715, .0715, .09, 24, 1, true), M(0xff6b4a)); g.add(et);
  return g;
}
function sprite(texto) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128; const x = c.getContext("2d");
  x.font = "800 92px system-ui, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.lineWidth = 14; x.strokeStyle = "#0b2a20"; x.strokeText(texto, 128, 66); x.fillStyle = "#c6f26b"; x.fillText(texto, 128, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  s.scale.set(.5, .25, 1); return s;
}

/* ---------- Escena ---------- */
async function iniciar() {
  const mindar = new MindARThree({
    container: $("ar"), imageTargetSrc: "ar/tarjeta.mind", maxTrack: 1,
    uiLoading: "no", uiScanning: "no", uiError: "no",
    filterMinCF: 0.0005, filterBeta: 60, missTolerance: 8, warmupTolerance: 4,
  });
  const { renderer, scene, camera } = mindar;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  const sol = new THREE.DirectionalLight(0xffffff, 2.2); sol.position.set(.5, 1, 1.5); scene.add(sol);

  const anchor = mindar.addAnchor(0);
  const mundo = new THREE.Group(); mundo.rotation.x = Math.PI / 2; mundo.scale.setScalar(.55);   // lo que "se para" sobre la tarjeta
  const giro = new THREE.Group(); giro.add(mundo); anchor.group.add(giro);   // 'giro' hace que la mascota mire siempre hacia ti
  const camLocal = new THREE.Vector3();
  const sombra = new THREE.Mesh(new THREE.CircleGeometry(.17, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .28 }));
  anchor.group.add(sombra); sombra.position.z = .003;

  const v = mascota(); v.g.scale.setScalar(1.15); v.g.position.set(0, 0, 0); mundo.add(v.g);
  const l = lata(); mundo.add(l);
  const mas = sprite("+20"); mundo.add(mas); mas.visible = false;

  let encontrada = false;
  anchor.onTargetFound = () => { encontrada = true; $("hint").classList.add("hide"); $("frame").classList.add("hide"); $("found").classList.add("show"); setTimeout(() => $("found").classList.remove("show"), 2200); };
  anchor.onTargetLost = () => { encontrada = false; $("hint").classList.remove("hide"); $("frame").classList.remove("hide"); };

  await mindar.start();
  $("load").classList.add("hide");

  const reloj = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = reloj.getElapsedTime(), c = (t % 3.2) / 3.2;       // ciclo de 3.2 s
    // la lata cae a la boca de la mascota
    const caida = Math.min(1, c / .5);
    l.visible = c < .52;
    l.position.set(Math.sin(t * 2) * .02, .62 + (1 - caida * caida) * 1.0 - caida * .1, 0.04);
    l.rotation.set(0, t * 3, .5 * (1 - caida));
    // la mascota se aplasta y salta cuando traga
    const tragar = c > .5 && c < .75 ? Math.sin((c - .5) / .25 * Math.PI) : 0;
    v.g.scale.set(1.15 * (1 + .12 * tragar), 1.15 * (1 - .18 * tragar), 1.15 * (1 + .12 * tragar));
    v.g.position.y = Math.abs(Math.sin(t * 3.1)) * .02 + (c > .75 && c < .9 ? Math.sin((c - .75) / .15 * Math.PI) * .12 : 0);
    v.tapa.rotation.x = -(c > .3 && c < .7 ? Math.sin((c - .3) / .4 * Math.PI) * 1.1 : 0);
    // +20 sube
    const s = c > .55 && c < .95 ? (c - .55) / .4 : -1;
    mas.visible = s >= 0; if (s >= 0) { mas.position.set(0, .75 + s * .35, .12); mas.material.opacity = 1 - Math.max(0, s - .6) / .4; }
    camLocal.copy(camera.position); anchor.group.worldToLocal(camLocal);
    giro.rotation.z = Math.atan2(camLocal.x, -camLocal.y);
    renderer.render(scene, camera);
  });
  window.__ar = { mindar, get encontrada() { return encontrada; } };
}
iniciar().catch(e => {
  console.error(e);
  const n = (e && e.name) || "";
  if (n === "NotAllowedError" || /denied|permission/i.test(String(e))) stop("Necesito tu cámara", "Activa el permiso de la cámara para esta página (en el candado de la barra de direcciones) y vuelve a abrirla.");
  else if (n === "NotFoundError") stop("No encontré una cámara", "Prueba desde tu celular.");
  else stop("No pude abrir la RA", "Cierra otras apps que usen la cámara y recarga la página.");
});
</script>
</body>
</html>
